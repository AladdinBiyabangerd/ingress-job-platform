services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ingress_job
      POSTGRES_PASSWORD: ingress_job
      POSTGRES_DB: ingress_job
    ports:
      - "5434:5432"
    volumes:
      - ingress_job_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6380:6379"
volumes:
  ingress_job_pg:
