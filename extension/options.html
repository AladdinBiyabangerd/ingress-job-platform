<!doctype html>
<html lang="az">
<head><meta charset="utf-8" /><title>Ingress Job – Ayarlar</title>
<style>body{font:14px system-ui;max-width:480px;margin:30px auto}label{display:block;margin:14px 0 4px}input{width:100%;padding:8px;box-sizing:border-box}button{margin-top:16px;padding:8px 16px}</style></head>
<body>
  <h2>Ingress Job – Ayarlar</h2>
  <label for="apiBase">Sayt (web) ünvanı</label>
  <input id="apiBase" placeholder="http://localhost:3010" />
  <small>API-yə birbaşa yox, saytın ünvanını yazın: lokal <code>http://localhost:3010</code>, canlı üçün saytın domeni (məs. <code>https://your-site.example</code>). Sorğu <code>/api/v1/import/linkedin-jobs</code> ilə saytdan API-yə ötürülür.</small>
  <label for="token">Import token (.env-dəki JOB_IMPORT_TOKEN)</label>
  <input id="token" type="password" autocomplete="off" />
  <button id="save">Yadda saxla</button> <span id="msg"></span>
  <script src="options.js"></script>
</body>
</html>
